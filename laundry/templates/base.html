<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Laundry Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('laundry.dashboard') }}">🧺 Laundry Tracker</a>
    <nav>
      <a href="{{ url_for('laundry.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('laundry.order_baru') }}" class="btn">+ Order Baru</a>
      <a href="{{ url_for('laundry.lacak') }}">Lacak</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
